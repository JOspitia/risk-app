# Configuracion local de Supabase (ADR-32).
#
# El CLI de Supabase es la unica herramienta de migraciones del proyecto.
# El esquema vive en `migrations/*.sql` y nunca se edita a mano.

project_id = "risk-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

# En desarrollo, el correo se escribe en el log en vez de enviarse.
# El proveedor de correo puede esperar: la v1 no depende de el.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
