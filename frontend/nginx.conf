# =============================================================================
# nginx sirve el bundle de produccion del frontend.
#
# Es la misma configuracion que usa Vercel para una aplicacion de una sola
# pagina: cualquier ruta que no sea un archivo del bundle se responde con
# `index.html`, para que el enrutador del navegador tome la ruta.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El bundle se sirve con la cache del navegador: los archivos tienen el
    # hash del contenido en el nombre, asi que un cambio es un archivo nuevo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # `index.html` nunca se cachea: es el que apunta a los archivos con hash.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # La aplicacion de una sola pagina: cualquier ruta desconocida devuelve el
    # index y la resuelve el enrutador del navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de Vite en modo desarrollo no aplican aqui, pero el
    # chunk grande del motor LLM conviene servirse sin comprimirlo: comprimirlo
    # cuesta tiempo de CPU y no ahorra casi nada.
    location ~* \.wasm$ {
        gzip off;
        add_header Content-Type application/wasm;
    }
}
